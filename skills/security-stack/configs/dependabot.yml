# Copy to .github/dependabot.yml
# Report-only: Dependabot opens pull requests. Nothing here auto-merges.
# Free GitHub service. Runs do not consume Actions minutes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  # Uncomment the ecosystem the repo actually has. Delete npm if it does not.
