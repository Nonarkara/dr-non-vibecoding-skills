# Copy to .github/workflows/zap-baseline.yml only when the M5 is a
# self-hosted runner with the label m5. DAST stays on that machine.
# Do not set runs-on to ubuntu-latest. Do not run this on the M3.
# Target a URL we operate. Never a third-party API.
# The action's default files a GitHub issue. allow_issue_writing stays false.
# Image: ghcr.io/zaproxy/zaproxy:2.17.0 (release 15 Dec 2025). Record the
# digest in the PR: docker image inspect --format '{{index .RepoDigests 0}}'.
name: zap-baseline
on:
  workflow_dispatch:
    inputs:
      target:
        description: Live URL we operate
        required: true
        type: string
permissions:
  contents: read
jobs:
  zap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, m5]
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target }}
          allow_issue_writing: false
          fail_action: false
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          artifact_name: zap-baseline
