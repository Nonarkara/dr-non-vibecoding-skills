name: Validate skills repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate cross-agent skills, links, counts, and plugin
        run: python3 scripts/validate_repo.py
      - name: Check shell syntax
        run: bash -n setup.sh scripts/*.sh
      - name: Prove skill installation is additive
        run: bash scripts/test-install-skills.sh
      - name: Prove first-time-user bootstrap works offline
        run: bash scripts/test-bootstrap.sh
      - name: Prove security evidence cannot silently clear missing controls
        run: python3 scripts/test-security-release.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove starter failure states are honest
        run: node scripts/test-starter.mjs
      - name: Install isolated browser-test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/drnon-browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/drnon-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prove fresh bootstrap in a browser
        run: DR_NON_PLAYWRIGHT="$RUNNER_TEMP/drnon-browser/node_modules/playwright/index.mjs" node scripts/test-starter-browser.mjs
      - name: Prove the Cloudflare runaway-cost grep
        run: bash scripts/test-cf-runaway-cost.sh
